name: run-rewards

on:
  workflow_dispatch:
    inputs:
      debug_daily_set:
        description: Show sanitized Daily Set diagnostics
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *' # 07:00 Asia/Ho_Chi_Minh; GitHub may queue the run.

permissions:
  contents: read

concurrency:
  group: rewards-accounts-1-6
  cancel-in-progress: false

jobs:
  account_1:
    name: Account 1/6
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 1
      debug_daily_set: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_daily_set || false }}
    secrets: inherit

  account_2:
    name: Account 2/6
    needs: account_1
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 2
      debug_daily_set: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_daily_set || false }}
    secrets: inherit

  account_3:
    name: Account 3/6
    needs: account_2
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 3
      debug_daily_set: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_daily_set || false }}
    secrets: inherit

  account_4:
    name: Account 4/6
    needs: account_3
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 4
      debug_daily_set: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_daily_set || false }}
    secrets: inherit

  account_5:
    name: Account 5/6
    needs: account_4
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 5
      debug_daily_set: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_daily_set || false }}
    secrets: inherit

  account_6:
    name: Account 6/6
    needs: account_5
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 6
      debug_daily_set: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_daily_set || false }}
    secrets: inherit

  summary:
    name: Daily Telegram summary
    needs: [account_1, account_2, account_3, account_4, account_5, account_6]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send totals privately
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
          ACCOUNT_2_EMAIL: ${{ secrets.ACCOUNT_2_EMAIL }}
          ACCOUNT_3_EMAIL: ${{ secrets.ACCOUNT_3_EMAIL }}
          ACCOUNT_4_EMAIL: ${{ secrets.ACCOUNT_4_EMAIL }}
          ACCOUNT_5_EMAIL: ${{ secrets.ACCOUNT_5_EMAIL }}
          ACCOUNT_6_EMAIL: ${{ secrets.ACCOUNT_6_EMAIL }}
        run: node .github/scripts/rewards-runner.cjs summary

