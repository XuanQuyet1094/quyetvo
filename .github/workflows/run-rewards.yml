name: run-rewards

on:
  workflow_dispatch:
    inputs:
      debug_daily_set:
        description: 'Show sanitized Daily Set diagnostics'
        type: boolean
        default: true
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: read

concurrency:
  group: rewards-account-1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: XuanQuyet1094/Microsoft-Rewards-Script
          ref: v4
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instrument Daily Set diagnostics
        env:
          DEBUG_DAILY_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_daily_set && 'true' || 'false' }}
        run: |
          node <<'NODE'
          if (process.env.DEBUG_DAILY_SET !== 'true') process.exit(0);
          const fs = require('node:fs');
          const p = 'src/functions/activities/rewards/DailySet.ts';
          const source = fs.readFileSync(p, 'utf8');
          const anchor = 'const today = this.bot.utils.getFormattedDate()';
          if (source.split(anchor).length !== 2) throw new Error('Daily Set source changed; diagnostic patch needs review');
          const extra = `
                  const groups = data.dashboard.dailySetPromotions ?? {}
                  const safeDates = Object.keys(groups).filter(key => /^\\d{2}\\/\\d{2}\\/\\d{4}$/.test(key))
                  console.log('DAILY_SET_DIAGNOSTIC ' + JSON.stringify({
                      utcNow: new Date().toISOString(),
                      machineDate: today,
                      vietnamDate: new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' }).format(new Date()),
                      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                      partialDashboard: this.bot.browser.func.isUsingPartialDashboard(),
                      selectedDatePresent: Object.prototype.hasOwnProperty.call(groups, today),
                      totalDateKeys: Object.keys(groups).length,
                      groups: safeDates.map(date => ({date, total: groups[date]!.length,
                          incomplete: groups[date]!.filter(item => !item.complete).length,
                          pendingWithPoints: groups[date]!.filter(item => !item.complete && item.pointProgressMax > 0).length}))
                  }))
          `;
          fs.writeFileSync(p, source.replace(anchor, anchor + extra));
          NODE

      - name: Install and build
        run: |
          npm ci --include=dev
          npx --no-install patchright install --with-deps chromium
          npm run build
          test -f dist/index.js

      - name: Configure headless browser
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('config.example.json', 'utf8'));
          cfg.headless = true;
          cfg.clusters = 1;
          cfg.errorDiagnostics = false;
          cfg.debugLogs = false;
          for (const name of ['telegram', 'discord', 'ntfy']) {
            if (cfg.webhook?.[name]) cfg.webhook[name].enabled = false;
          }
          fs.writeFileSync('config.json', JSON.stringify(cfg, null, 2) + '\n', {mode: 0o600});
          // Account credentials are provided through the process environment.
          fs.writeFileSync('.env', '', {mode: 0o600});
          NODE

      - name: Start and check SOCKS5
        env:
          AZDIGI_SSH_KEY: ${{ secrets.AZDIGI_SSH_KEY }}
          AZDIGI_KNOWN_HOSTS: ${{ secrets.AZDIGI_KNOWN_HOSTS }}
        run: |
          : "${AZDIGI_SSH_KEY:?Missing AZDIGI_SSH_KEY}"
          : "${AZDIGI_KNOWN_HOSTS:?Missing AZDIGI_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AZDIGI_SSH_KEY" | tr -d '\r' > ~/.ssh/azdigi_key
          printf '%s\n' "$AZDIGI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/azdigi_key ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/azdigi_key >/dev/null
          ssh -M -S "$RUNNER_TEMP/azdigi.sock" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -f -N -D 127.0.0.1:1080 -p 2210 \
            -i ~/.ssh/azdigi_key labotecc@hv42-25048.azdigihost.com
          for url in https://rewards.bing.com/ https://www.bing.com/; do
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --proxy socks5h://127.0.0.1:1080 "$url" -o /dev/null
          done

      - name: Run account 1
        id: bot
        env:
          DEBUG_DAILY_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_daily_set && 'true' || 'false' }}
          ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
          ACCOUNT_1_PASSWORD: ${{ secrets.ACCOUNT_1_PASSWORD }}
          ACCOUNT_1_TOTP_SECRET: ${{ secrets.ACCOUNT_1_TOTP_SECRET }}
          ACCOUNT_1_GEO_LOCALE: VN
          ACCOUNT_1_LANG_CODE: vi
          ACCOUNT_1_PROXY_HTTP: 'true'
          ACCOUNT_1_PROXY_URL: socks5://127.0.0.1
          ACCOUNT_1_PROXY_PORT: '1080'
        run: |
          : "${ACCOUNT_1_EMAIL:?Missing ACCOUNT_1_EMAIL}"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const readline = require('node:readline');
          const {spawn} = require('node:child_process');
          const resultPath = path.join(process.env.RUNNER_TEMP, 'account-result.json');
          const log = fs.createWriteStream(path.join(process.env.RUNNER_TEMP, 'bot-private.log'), {mode: 0o600});
          let last = null;
          const diagnosticPath = path.join(process.env.RUNNER_TEMP, 'account-diagnostic.json');
          const diagnostic = {stage: 'STARTING', loginState: null, errors: [], exitCode: null, signal: null, dailySet: null};
          function saveDiagnostic() {
            fs.writeFileSync(diagnosticPath, JSON.stringify(diagnostic), {mode: 0o600});
          }
          saveDiagnostic();
          // Only fixed labels may leave the runner; never forward arbitrary log text.
          function diagnose(line) {
            const clean = line.replace(/\x1b\[[0-9;]*m/g, '');
            if (clean.startsWith('DAILY_SET_VERIFICATION ')) {
              try {
                const v = JSON.parse(clean.slice('DAILY_SET_VERIFICATION '.length));
                if (['complete', 'incomplete', 'unverified'].includes(v.state) && [v.total, v.completed, v.remaining].every(n => Number.isSafeInteger(n) && n >= 0)) {
                  diagnostic.dailySet = {state: v.state, total: v.total, completed: v.completed, remaining: v.remaining};
                  if (process.env.DEBUG_DAILY_SET === 'true') console.log('Daily Set verification: ' + JSON.stringify(diagnostic.dailySet));
                }
              } catch {}
            }
            if (process.env.DEBUG_DAILY_SET === 'true') {
              if (clean.startsWith('SERVER_ACTION_DIAGNOSTIC ')) {
                try {
                  const v = JSON.parse(clean.slice('SERVER_ACTION_DIAGNOSTIC '.length));
                  const safe = {};
                  for (const k of ['length', 'rows', 'decimalTrueRows', 'hexTrueRows', 'falseRows', 'errorRows', 'status']) {
                    if (Number.isSafeInteger(v[k]) && v[k] >= 0) safe[k] = v[k];
                  }
                  for (const k of ['html', 'redirectMarker', 'hasAvailablePoints', 'acknowledged']) safe[k] = v[k] === true;
                  for (const [k, allowed] of Object.entries({kind: ['string', 'object', 'array', 'null', 'boolean', 'number', 'undefined'], contentType: ['rsc', 'json', 'html', 'other'], route: ['earn', 'dashboard', 'other']})) {
                    safe[k] = allowed.includes(v[k]) ? v[k] : 'other';
                  }
                  console.log('Server action response shape: ' + JSON.stringify(safe));
                } catch { console.log('Server action diagnostic could not be parsed'); }
              }
              if (clean.startsWith('DAILY_SET_URL_DIAGNOSTIC ')) {
                try {
                  const v = JSON.parse(clean.slice('DAILY_SET_URL_DIAGNOSTIC '.length));
                  const source = ['dashboard', 'snapshot'].includes(v.source) ? v.source : 'other';
                  const host = typeof v.host === 'string' && /(^|\\.)bing\\.com$/i.test(v.host) ? v.host : 'other';
                  console.log('Daily Set URL: ' + JSON.stringify({
                    source, host,
                    hasBTDSUOID: v.hasBTDSUOID === true,
                    hasPUBL: v.hasPUBL === true,
                    hasCREA: v.hasCREA === true,
                    hasRnoreward: v.hasRnoreward === true
                  }));
                } catch { console.log('Daily Set URL diagnostic could not be parsed'); }
              }
              if (clean.startsWith('DAILY_SET_DIAGNOSTIC ')) {
                try {
                  const v = JSON.parse(clean.slice('DAILY_SET_DIAGNOSTIC '.length));
                  const date = value => typeof value === 'string' && /^[0-9TZ:./+-]+$/.test(value) ? value : '?';
                  console.log('Daily Set dates: ' + JSON.stringify({utc: date(v.utcNow), machine: date(v.machineDate), vietnam: date(v.vietnamDate), partialDashboard: v.partialDashboard === true, selectedDatePresent: v.selectedDatePresent === true,
                    groups: (Array.isArray(v.groups) ? v.groups : []).slice(0, 14).map(g => ({date: date(g.date), total: Number(g.total), incomplete: Number(g.incomplete), pendingWithPoints: Number(g.pendingWithPoints)}))}));
                } catch { console.log('Daily Set diagnostic could not be parsed'); }
              }
              const tag = clean.match(/\[(DAILY-SET|ACTIVITY|URL-REWARD|GET-DASHBOARD-DATA|REACT-PARSE)\]/)?.[1];
              if (tag) {
                const labels = [
                  ['All "Daily Set" items have already been completed', 'NO_PENDING_ITEMS'],
                  ['Started solving', 'STARTED'], ['Finished processing', 'FINISHED_PROCESSING'],
                  ['Starting UrlReward', 'URL_REWARD_STARTED'], ['Completed UrlReward', 'URL_REWARD_COMPLETED'],
                  ['credited no points', 'NO_POINTS_CREDITED'], ['not acknowledged', 'NOT_ACKNOWLEDGED'],
                  ['not reportable', 'NOT_REPORTABLE'], ['not present in page snapshot', 'OFFER_NOT_FOUND'],
                  ['not discovered in bundle', 'ACTION_NOT_FOUND'], ['unsupported type', 'UNSUPPORTED_TYPE'],
                  ['disabled in config', 'DISABLED'], ['using Bing flyout fallback', 'FALLBACK_SELECTED'],
                  ['Using partial Bing flyout dashboard', 'PARTIAL_DASHBOARD'], ['Error in doUrlReward', 'URL_REWARD_ERROR']
                ].filter(([needle]) => clean.includes(needle)).map(([, label]) => label);
                const counts = [...clean.matchAll(/\b(remaining|offers|reportable|streaks|pointsGained|currentBalance|expected|status)=(-?\d+)\b/g)].map(m => m[1] + '=' + m[2]);
                console.log('[Diagnostic][' + tag + '] ' + [...labels, ...counts].join(' '));
              }
            }
            const stage = clean.match(/\[(BROWSER|SESSION|LOGIN|LOGIN-ENTER-EMAIL|LOGIN-ENTER-PASSWORD|DAILY-SET|READ-TO-EARN|SEARCH-MANAGER|SEARCH-BING)\]/)?.[1];
            if (stage) diagnostic.stage = stage;
            const state = clean.match(/State transition: [A-Z_]+\s*\u2192\s*(EMAIL_INPUT|FOOTER_ACTION|PASSWORD_INPUT|KMSI_PROMPT|ERROR_ALERT|EMAIL_VERIFICATION_INPUT|TOTP_INPUT|OTP_INPUT)\b/)?.[1];
            if (state) diagnostic.loginState = state;
            const patterns = [
              [/net::ERR_EMPTY_RESPONSE/, 'ERR_EMPTY_RESPONSE'],
              [/net::ERR_PROXY_CONNECTION_FAILED/, 'ERR_PROXY_CONNECTION_FAILED'],
              [/net::ERR_SOCKS_CONNECTION_FAILED/, 'ERR_SOCKS_CONNECTION_FAILED'],
              [/net::ERR_TUNNEL_CONNECTION_FAILED/, 'ERR_TUNNEL_CONNECTION_FAILED'],
              [/net::ERR_NAME_NOT_RESOLVED/, 'ERR_NAME_NOT_RESOLVED'],
              [/net::ERR_CONNECTION_RESET/, 'ERR_CONNECTION_RESET'],
              [/Microsoft login error: Unknown Error/, 'MICROSOFT_LOGIN_UNKNOWN_ERROR'],
              [/Password input detected but no password is configured/, 'PASSWORD_NOT_CONFIGURED'],
              [/Executable doesn't exist/, 'BROWSER_EXECUTABLE_MISSING'],
              [/error while loading shared libraries/, 'BROWSER_LIBRARY_MISSING'],
              [/Missing X server|without having a XServer/, 'DISPLAY_MISSING'],
              [/Target page, context or browser has been closed/, 'BROWSER_OR_CONTEXT_CLOSED'],
              [/TimeoutError|Timeout \d+ms exceeded|timed out/i, 'TIMEOUT'],
              [/Fraud_UserWarning_BotScore_UX/, 'BOT_WARNING'],
              [/chromewebdata error/i, 'CHROMEWEBDATA_ERROR']
            ];
            let recognized = false;
            for (const [pattern, label] of patterns) {
              if (!pattern.test(clean)) continue;
              recognized = true;
              if (!diagnostic.errors.includes(label)) diagnostic.errors.push(label);
            }
            if (/\[ERROR\]/.test(clean) && !recognized && !diagnostic.errors.includes('UNCLASSIFIED_ERROR')) {
              diagnostic.errors.push('UNCLASSIFIED_ERROR');
            }
            saveDiagnostic();
          }
          const child = spawn('npm', ['start'], {stdio: ['ignore', 'pipe', 'pipe']});
          function consume(stream) {
            readline.createInterface({input: stream}).on('line', line => {
              log.write(line + '\n');
              diagnose(line);
              const marker = 'RECOVERY_ACCOUNT_RESULT ';
              const at = line.indexOf(marker);
              if (at < 0) return;
              try {
                const r = JSON.parse(line.slice(at + marker.length));
                if (String(r.accountId) === '1' && r.finishedAt) {
                  last = r;
                  fs.writeFileSync(resultPath, JSON.stringify(r), {mode: 0o600});
                }
              } catch {}
            });
          }
          consume(child.stdout);
          consume(child.stderr);
          const heartbeat = setInterval(() => console.log('Account 1: still running; private logs are not published.'), 60000);
          child.on('error', () => {
            diagnostic.errors.push('BOT_PROCESS_START_FAILED');
            saveDiagnostic();
            clearInterval(heartbeat);
            console.error('Unable to start bot.');
            process.exitCode = 1;
          });
          child.on('close', (code, signal) => {
            diagnostic.exitCode = code;
            diagnostic.signal = signal;
            saveDiagnostic();
            clearInterval(heartbeat);
            log.end();
            const failed = !last || !['success', 'completed'].includes(last.status);
            console.log('Account 1 finished; detailed result will be sent privately.');
            process.exitCode = code === 0 && !failed ? 0 : 1;
          });
          NODE

      - name: Send one Telegram result
        if: ${{ always() }}
        env:
          ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_OUTCOME: ${{ steps.bot.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chat = process.env.TELEGRAM_CHAT_ID;
            if (!token || !chat) throw new Error('Telegram secrets missing');
            let r = {};
            try { r = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'account-result.json'), 'utf8')); } catch {}
            let d = {};
            try { d = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'account-diagnostic.json'), 'utf8')); } catch {}
            const text = [
              `Microsoft Rewards - ${process.env.ACCOUNT_1_EMAIL?.trim() || 'Account 1'}`,
              `Run attempt: ${process.env.GITHUB_RUN_ATTEMPT || 'unknown'}`,
              `Status: ${r.status || process.env.BOT_OUTCOME || 'not started'}`,
              `Date: ${r.date || 'unknown'}`,
              `Points gained this run: ${r.pointsEarned ?? 'unknown'}`,
              `Balance: ${r.initialBalance ?? '?'} -> ${r.finalBalance ?? '?'}`,
              `Daily completion: ${r.dailyPointsComplete ?? 'unverified'}`,
              `Daily Set: ${d.dailySet ? d.dailySet.state + ' (' + d.dailySet.completed + '/' + d.dailySet.total + ')' : 'unverified'}`,
              `Error: ${r.errorCode || (!r.finishedAt ? 'No final account result; check workflow steps' : 'none')}`,
              `Last stage: ${d.stage || 'not started'}`,
              `Last login state: ${d.loginState || 'not recorded'}`,
              `Observed errors: ${(d.errors || []).join(', ') || 'none captured'}`,
              `Process exit: ${d.exitCode ?? 'unknown'} | Signal: ${d.signal || 'none'}`,
              process.env.RUN_URL
            ].join('\n');
            const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({chat_id: chat, text}), signal: AbortSignal.timeout(20000)
            });
            const body = await response.json();
            if (!response.ok || !body.ok) throw new Error('Telegram rejected notification');
            console.log('Telegram result sent.');
          })().catch(() => { console.error('Telegram notification failed; check secrets and bot access.'); process.exitCode = 1; });
          NODE

      - name: Cleanup
        if: ${{ always() }}
        run: |
          if [ -S "$RUNNER_TEMP/azdigi.sock" ]; then
            ssh -S "$RUNNER_TEMP/azdigi.sock" -O exit -p 2210 labotecc@hv42-25048.azdigihost.com || true
          fi
          rm -f ~/.ssh/azdigi_key .env config.json "$RUNNER_TEMP/bot-private.log" "$RUNNER_TEMP/account-result.json" "$RUNNER_TEMP/account-diagnostic.json"
