name: Rewards account worker

on:
  workflow_call:
    inputs:
      account:
        type: number
        required: true
      run_mode:
        type: string
        required: true
      run_date:
        type: string
        required: true
      debug_daily_set:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      RUN_MODE: ${{ inputs.run_mode }}
      RUN_DATE: ${{ inputs.run_date }}
      ACCOUNT_SLOT: ${{ inputs.account }}
      BOT_DIR: ${{ github.workspace }}/bot
      REPORT_PATH: ${{ github.workspace }}/rewards-result.json
      DEBUG_DAILY_SET: ${{ inputs.debug_daily_set && 'true' || 'false' }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout automation
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify configuration before reserving an attempt
        env:
          ACCOUNT_EMAIL: ${{ secrets[format('ACCOUNT_{0}_EMAIL', inputs.account)] }}
          ACCOUNT_PASSWORD: ${{ secrets[format('ACCOUNT_{0}_PASSWORD', inputs.account)] }}
          ACCOUNT_TOTP_SECRET: ${{ secrets[format('ACCOUNT_{0}_TOTP_SECRET', inputs.account)] }}
          REWARDS_PRIVATE_REPO: ${{ secrets.REWARDS_PRIVATE_REPO }}
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AZDIGI_SSH_HOST: ${{ secrets.AZDIGI_SSH_HOST }}
          AZDIGI_SSH_USER: ${{ secrets.AZDIGI_SSH_USER }}
          AZDIGI_SSH_PORT: ${{ secrets.AZDIGI_SSH_PORT }}
          AZDIGI_SSH_KEY: ${{ secrets.AZDIGI_SSH_KEY }}
          AZDIGI_KNOWN_HOSTS: ${{ secrets.AZDIGI_KNOWN_HOSTS }}
        run: node automation/.github/scripts/rewards-operations.cjs preflight

      - name: Check and reserve daily attempt in private state
        id: claim
        env:
          REWARDS_PRIVATE_REPO: ${{ secrets.REWARDS_PRIVATE_REPO }}
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
        run: node automation/.github/scripts/rewards-state.cjs claim

      - name: Checkout private v4 source
        if: ${{ steps.claim.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REWARDS_PRIVATE_REPO }}
          ref: v4
          path: bot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install browser and build
        if: ${{ steps.claim.outputs.run == 'true' }}
        timeout-minutes: 15
        run: node automation/.github/scripts/rewards-operations.cjs build

      - name: Configure single-account run
        if: ${{ steps.claim.outputs.run == 'true' }}
        run: node automation/.github/scripts/rewards-runner.cjs configure

      - name: Start verified AZDIGI SOCKS5 tunnel
        if: ${{ steps.claim.outputs.run == 'true' }}
        timeout-minutes: 3
        env:
          AZDIGI_SSH_HOST: ${{ secrets.AZDIGI_SSH_HOST }}
          AZDIGI_SSH_USER: ${{ secrets.AZDIGI_SSH_USER }}
          AZDIGI_SSH_PORT: ${{ secrets.AZDIGI_SSH_PORT }}
          AZDIGI_SSH_KEY: ${{ secrets.AZDIGI_SSH_KEY }}
          AZDIGI_KNOWN_HOSTS: ${{ secrets.AZDIGI_KNOWN_HOSTS }}
        run: |
          : "${AZDIGI_SSH_HOST:?Missing AZDIGI_SSH_HOST}"
          : "${AZDIGI_SSH_USER:?Missing AZDIGI_SSH_USER}"
          : "${AZDIGI_SSH_PORT:?Missing AZDIGI_SSH_PORT}"
          : "${AZDIGI_SSH_KEY:?Missing AZDIGI_SSH_KEY}"
          : "${AZDIGI_KNOWN_HOSTS:?Missing AZDIGI_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AZDIGI_SSH_KEY" | tr -d '\r' > ~/.ssh/azdigi_key
          printf '%s\n' "$AZDIGI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/azdigi_key ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/azdigi_key >/dev/null
          ssh -M -S "$RUNNER_TEMP/azdigi.sock" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -f -N -D 127.0.0.1:1080 -p "$AZDIGI_SSH_PORT" \
            -i ~/.ssh/azdigi_key "$AZDIGI_SSH_USER@$AZDIGI_SSH_HOST"
          for url in https://rewards.bing.com/ https://www.bing.com/; do
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              --proxy socks5h://127.0.0.1:1080 "$url" -o /dev/null
          done

      - name: Run selected account (maximum 75 minutes)
        if: ${{ steps.claim.outputs.run == 'true' }}
        id: bot
        continue-on-error: true
        env:
          ACCOUNT_EMAIL: ${{ secrets[format('ACCOUNT_{0}_EMAIL', inputs.account)] }}
          ACCOUNT_PASSWORD: ${{ secrets[format('ACCOUNT_{0}_PASSWORD', inputs.account)] }}
          ACCOUNT_TOTP_SECRET: ${{ secrets[format('ACCOUNT_{0}_TOTP_SECRET', inputs.account)] }}
          ACCOUNT_RECOVERY_EMAIL: ${{ secrets[format('ACCOUNT_{0}_RECOVERY_EMAIL', inputs.account)] }}
        run: node automation/.github/scripts/rewards-runner.cjs run

      - name: Persist result and redacted private log
        if: ${{ always() && steps.claim.outputs.run == 'true' }}
        env:
          REWARDS_PRIVATE_REPO: ${{ secrets.REWARDS_PRIVATE_REPO }}
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
          STATE_STORED: ${{ steps.claim.outputs.stored }}
          JOB_STATUS: ${{ job.status }}
        run: node automation/.github/scripts/rewards-state.cjs finish

      - name: Save account report and queue private notification
        id: prepare_report
        if: ${{ always() && steps.claim.outputs.run == 'true' }}
        env:
          ACCOUNT_EMAIL: ${{ secrets[format('ACCOUNT_{0}_EMAIL', inputs.account)] }}
          REWARDS_PRIVATE_REPO: ${{ secrets.REWARDS_PRIVATE_REPO }}
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_OUTCOME: ${{ steps.bot.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: node automation/.github/scripts/rewards-runner.cjs prepare-report

      - name: Deliver saved account notification
        if: ${{ always() && steps.prepare_report.outcome == 'success' }}
        env:
          REWARDS_PRIVATE_REPO: ${{ secrets.REWARDS_PRIVATE_REPO }}
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node automation/.github/scripts/rewards-runner.cjs report

      - name: Cleanup tunnel and sensitive files
        if: ${{ always() }}
        env:
          AZDIGI_SSH_HOST: ${{ secrets.AZDIGI_SSH_HOST }}
          AZDIGI_SSH_USER: ${{ secrets.AZDIGI_SSH_USER }}
          AZDIGI_SSH_PORT: ${{ secrets.AZDIGI_SSH_PORT }}
        run: |
          if [ -S "$RUNNER_TEMP/azdigi.sock" ]; then
            ssh -S "$RUNNER_TEMP/azdigi.sock" -O exit -p "$AZDIGI_SSH_PORT" "$AZDIGI_SSH_USER@$AZDIGI_SSH_HOST" || true
          fi
          rm -f ~/.ssh/azdigi_key ~/.ssh/known_hosts "$REPORT_PATH"
          rm -f "$BOT_DIR/.env" "$BOT_DIR/config.json"
          rm -rf "$BOT_DIR/sessions" "$BOT_DIR/diagnostics" "$RUNNER_TEMP/rewards-private"

      - name: Random rest before next account
        if: ${{ !cancelled() && steps.claim.outputs.run == 'true' && inputs.run_mode != 'test' && inputs.account < 6 }}
        run: node automation/.github/scripts/rewards-runner.cjs rest

      - name: Preserve bot failure status
        if: ${{ !cancelled() && steps.bot.outcome == 'failure' }}
        run: exit 1
