name: Login diagnostic

on:
  workflow_dispatch:
    inputs:
      account:
        description: Select one account for login-only diagnosis
        type: choice
        required: true
        options: ['1', '2', '3', '4', '5', '6']

permissions:
  contents: read

jobs:
  diagnose:
    name: Login diagnostic (single account)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUN_MODE: diagnostic
      ACCOUNT_SLOT: ${{ inputs.account }}
      BOT_DIR: ${{ github.workspace }}/bot
      REPORT_PATH: ${{ github.workspace }}/rewards-result.json
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false

      - name: Set Vietnam run date
        id: clock
        run: |
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'date=' + new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Ho_Chi_Minh'}).format(new Date()) + '\n')"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout private bot source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.REWARDS_PRIVATE_REPO }}
          ref: v4
          path: bot
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install browser and build
        timeout-minutes: 15
        run: node automation/.github/scripts/rewards-operations.cjs build

      - name: Configure login-only mode
        run: |
          RUN_DATE="${{ steps.clock.outputs.date }}" node automation/.github/scripts/rewards-runner.cjs configure-login-diagnostic
          node -e "const c=require('./bot/config.json'); if(Object.values(c.workers||{}).some(Boolean)||Object.values(c.activities||{}).some(Boolean)) process.exit(1); console.log('Login-only mode verified; all reward workers and activities are disabled.')"

      - name: Start verified AZDIGI SOCKS5 tunnel
        timeout-minutes: 3
        env:
          AZDIGI_SSH_HOST: ${{ secrets.AZDIGI_SSH_HOST }}
          AZDIGI_SSH_USER: ${{ secrets.AZDIGI_SSH_USER }}
          AZDIGI_SSH_PORT: ${{ secrets.AZDIGI_SSH_PORT }}
          AZDIGI_SSH_KEY: ${{ secrets.AZDIGI_SSH_KEY }}
          AZDIGI_KNOWN_HOSTS: ${{ secrets.AZDIGI_KNOWN_HOSTS }}
        run: |
          : "${AZDIGI_SSH_HOST:?Missing AZDIGI_SSH_HOST}"
          : "${AZDIGI_SSH_USER:?Missing AZDIGI_SSH_USER}"
          : "${AZDIGI_SSH_PORT:?Missing AZDIGI_SSH_PORT}"
          : "${AZDIGI_SSH_KEY:?Missing AZDIGI_SSH_KEY}"
          : "${AZDIGI_KNOWN_HOSTS:?Missing AZDIGI_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AZDIGI_SSH_KEY" | tr -d '\r' > ~/.ssh/azdigi_key
          printf '%s\n' "$AZDIGI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/azdigi_key ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/azdigi_key >/dev/null
          ssh -M -S "$RUNNER_TEMP/azdigi.sock" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -f -N -D 127.0.0.1:1080 -p "$AZDIGI_SSH_PORT" \
            -i ~/.ssh/azdigi_key "$AZDIGI_SSH_USER@$AZDIGI_SSH_HOST"
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --proxy socks5h://127.0.0.1:1080 https://login.live.com/ -o /dev/null

      - name: Run login-only diagnosis
        id: bot
        continue-on-error: true
        env:
          RUN_DATE: ${{ steps.clock.outputs.date }}
          ACCOUNT_EMAIL: ${{ secrets[format('ACCOUNT_{0}_EMAIL', inputs.account)] }}
          ACCOUNT_PASSWORD: ${{ secrets[format('ACCOUNT_{0}_PASSWORD', inputs.account)] }}
          ACCOUNT_TOTP_SECRET: ${{ secrets[format('ACCOUNT_{0}_TOTP_SECRET', inputs.account)] }}
          ACCOUNT_RECOVERY_EMAIL: ${{ secrets[format('ACCOUNT_{0}_RECOVERY_EMAIL', inputs.account)] }}
        run: |
          : "${ACCOUNT_EMAIL:?Missing selected account email secret}"
          node automation/.github/scripts/rewards-runner.cjs run

      - name: Save redacted log to private rewards-state
        if: always()
        env:
          RUN_DATE: ${{ steps.clock.outputs.date }}
          REWARDS_PRIVATE_REPO: ${{ secrets.REWARDS_PRIVATE_REPO }}
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
        run: |
          : "${REWARDS_STATE_TOKEN:?Missing REWARDS_STATE_TOKEN}"
          LOG="$RUNNER_TEMP/rewards-private/account-${ACCOUNT_SLOT}.log"
          if [[ -s "$LOG" || -s "$RUNNER_TEMP/rewards-private/setup-account-${ACCOUNT_SLOT}.log" ]]; then
            node automation/.github/scripts/rewards-state.cjs upload-log
          else
            echo "No bot log was produced; check which setup step failed."
          fi

      - name: Report diagnostic log location
        if: always()
        run: |
          echo "Detailed redacted log is stored in the configured private repository, branch rewards-state, under diagnostics/${{ steps.clock.outputs.date }}/ for account ${ACCOUNT_SLOT}."
          echo "This workflow does not update daily run state and does not run earning/search tasks."

      - name: Mark diagnostic outcome
        if: ${{ always() && steps.bot.outcome == 'failure' }}
        run: exit 1
