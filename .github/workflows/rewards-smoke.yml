name: rewards-smoke-test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rewards-smoke.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify retry rules and notification formatting
        run: node --test .github/scripts/rewards-runner.test.cjs .github/scripts/rewards-state.test.cjs
      - name: Test private state and send Telegram test
        env:
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node .github/scripts/rewards-smoke.cjs
