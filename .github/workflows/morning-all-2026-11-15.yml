name: Run daily worker once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/morning-all-2026-11-15.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: rewards-accounts-1-6
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ github.run_attempt == 1 }}
    outputs:
      date: ${{ steps.plan.outputs.date }}
      mode: ${{ steps.plan.outputs.mode }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate original Vietnam date and execution window
        id: plan
        env:
          INPUT_MODE: morning
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { planRun, MORNING } = require('./.github/scripts/rewards-schedule.cjs');
          const now = Date.now();
          const check = planRun({ GITHUB_EVENT_NAME: 'schedule', EVENT_SCHEDULE: MORNING }, new Date(now).toISOString(), now);
          if (check.date !== '2026-11-15' || !check.run) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run=false\n');
            process.exit(0);
          }
          NODE
          if ! grep -qx 'run=false' "$GITHUB_OUTPUT"; then
            node .github/scripts/rewards-schedule.cjs plan
          fi

  account_1:
    name: Worker
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 1
      run_mode: ${{ needs.plan.outputs.mode }}
      run_date: ${{ needs.plan.outputs.date }}
    secrets: inherit

  account_2:
    name: Worker
    needs: [plan, account_1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 2
      run_mode: ${{ needs.plan.outputs.mode }}
      run_date: ${{ needs.plan.outputs.date }}
    secrets: inherit

  account_3:
    name: Worker
    needs: [plan, account_2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 3
      run_mode: ${{ needs.plan.outputs.mode }}
      run_date: ${{ needs.plan.outputs.date }}
    secrets: inherit

  account_4:
    name: Worker
    needs: [plan, account_3]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 4
      run_mode: ${{ needs.plan.outputs.mode }}
      run_date: ${{ needs.plan.outputs.date }}
    secrets: inherit

  account_5:
    name: Worker
    needs: [plan, account_4]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 5
      run_mode: ${{ needs.plan.outputs.mode }}
      run_date: ${{ needs.plan.outputs.date }}
    secrets: inherit

  account_6:
    name: Worker
    needs: [plan, account_5]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 6
      run_mode: ${{ needs.plan.outputs.mode }}
      run_date: ${{ needs.plan.outputs.date }}
    secrets: inherit

  summary:
    name: Daily Telegram summary
    needs: [plan, account_1, account_2, account_3, account_4, account_5, account_6]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send totals privately
        env:
          REWARDS_PRIVATE_REPO: ${{ secrets.REWARDS_PRIVATE_REPO }}
          REWARDS_STATE_TOKEN: ${{ secrets.REWARDS_STATE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ needs.plan.outputs.mode }}
          RUN_DATE: ${{ needs.plan.outputs.date }}
          STATE_ENABLED: ${{ secrets.REWARDS_STATE_TOKEN != '' && 'true' || 'false' }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
          ACCOUNT_2_EMAIL: ${{ secrets.ACCOUNT_2_EMAIL }}
          ACCOUNT_3_EMAIL: ${{ secrets.ACCOUNT_3_EMAIL }}
          ACCOUNT_4_EMAIL: ${{ secrets.ACCOUNT_4_EMAIL }}
          ACCOUNT_5_EMAIL: ${{ secrets.ACCOUNT_5_EMAIL }}
          ACCOUNT_6_EMAIL: ${{ secrets.ACCOUNT_6_EMAIL }}
        run: node .github/scripts/rewards-runner.cjs summary

