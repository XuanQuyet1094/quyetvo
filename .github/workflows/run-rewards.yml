name: run-rewards

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *" # 07:15 Vietnam time

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Clone private bot repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --branch v4 --single-branch "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/XuanQuyet1094/Microsoft-Rewards-Script.git" bot

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create local secrets/config
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cp config.example.json config.json

          node - <<'NODE'
          const fs = require('fs');
          const p = 'config.json';
          const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));

          cfg.headless = true;
          cfg.clusters = 1;

          cfg.webhook = cfg.webhook || {};
          cfg.webhook.telegram = cfg.webhook.telegram || {};
          cfg.webhook.telegram.enabled = true;
          cfg.webhook.telegram.botToken = process.env.TELEGRAM_BOT_TOKEN || "";
          cfg.webhook.telegram.chatId = process.env.TELEGRAM_CHAT_ID || "";

          fs.writeFileSync(p, JSON.stringify(cfg, null, 4) + '\n');
          NODE

          cat > .env <<'EOF'
          ACCOUNT_1_EMAIL=${{ secrets.ACCOUNT_1_EMAIL }}
          ACCOUNT_1_PASSWORD=${{ secrets.ACCOUNT_1_PASSWORD }}
          ACCOUNT_1_TOTP_SECRET=${{ secrets.ACCOUNT_1_TOTP_SECRET }}
          ACCOUNT_1_GEO_LOCALE=VN
          ACCOUNT_1_LANG_CODE=vi
          ACCOUNT_1_PROXY_HTTP=false
          ACCOUNT_1_PROXY_URL=127.0.0.1
          ACCOUNT_1_PROXY_PORT=1080

          ACCOUNT_2_EMAIL=${{ secrets.ACCOUNT_2_EMAIL }}
          ACCOUNT_2_PASSWORD=${{ secrets.ACCOUNT_2_PASSWORD }}
          ACCOUNT_2_TOTP_SECRET=${{ secrets.ACCOUNT_2_TOTP_SECRET }}
          ACCOUNT_2_GEO_LOCALE=VN
          ACCOUNT_2_LANG_CODE=vi
          ACCOUNT_2_PROXY_HTTP=false
          ACCOUNT_2_PROXY_URL=127.0.0.1
          ACCOUNT_2_PROXY_PORT=1080

          ACCOUNT_3_EMAIL=${{ secrets.ACCOUNT_3_EMAIL }}
          ACCOUNT_3_PASSWORD=${{ secrets.ACCOUNT_3_PASSWORD }}
          ACCOUNT_3_TOTP_SECRET=${{ secrets.ACCOUNT_3_TOTP_SECRET }}
          ACCOUNT_3_GEO_LOCALE=VN
          ACCOUNT_3_LANG_CODE=vi
          ACCOUNT_3_PROXY_HTTP=false
          ACCOUNT_3_PROXY_URL=127.0.0.1
          ACCOUNT_3_PROXY_PORT=1080

          ACCOUNT_4_EMAIL=${{ secrets.ACCOUNT_4_EMAIL }}
          ACCOUNT_4_PASSWORD=${{ secrets.ACCOUNT_4_PASSWORD }}
          ACCOUNT_4_TOTP_SECRET=${{ secrets.ACCOUNT_4_TOTP_SECRET }}
          ACCOUNT_4_GEO_LOCALE=VN
          ACCOUNT_4_LANG_CODE=vi
          ACCOUNT_4_PROXY_HTTP=false
          ACCOUNT_4_PROXY_URL=127.0.0.1
          ACCOUNT_4_PROXY_PORT=1080

          ACCOUNT_5_EMAIL=${{ secrets.ACCOUNT_5_EMAIL }}
          ACCOUNT_5_PASSWORD=${{ secrets.ACCOUNT_5_PASSWORD }}
          ACCOUNT_5_TOTP_SECRET=${{ secrets.ACCOUNT_5_TOTP_SECRET }}
          ACCOUNT_5_GEO_LOCALE=VN
          ACCOUNT_5_LANG_CODE=vi
          ACCOUNT_5_PROXY_HTTP=false
          ACCOUNT_5_PROXY_URL=127.0.0.1
          ACCOUNT_5_PROXY_PORT=1080

          ACCOUNT_6_EMAIL=${{ secrets.ACCOUNT_6_EMAIL }}
          ACCOUNT_6_PASSWORD=${{ secrets.ACCOUNT_6_PASSWORD }}
          ACCOUNT_6_TOTP_SECRET=${{ secrets.ACCOUNT_6_TOTP_SECRET }}
          ACCOUNT_6_GEO_LOCALE=VN
          ACCOUNT_6_LANG_CODE=vi
          ACCOUNT_6_PROXY_HTTP=false
          ACCOUNT_6_PROXY_URL=127.0.0.1
          ACCOUNT_6_PROXY_PORT=1080
          EOF

      - name: Start AZDIGI SOCKS5 tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AZDIGI_SSH_KEY }}" > ~/.ssh/azdigi_key
          chmod 600 ~/.ssh/azdigi_key

          ssh -o StrictHostKeyChecking=no \
              -o ExitOnForwardFailure=yes \
              -f -N -D 127.0.0.1:1080 \
              -p 2210 \
              -i ~/.ssh/azdigi_key \
              labotecc@hv42-25048.azdigihost.com

      - name: Test AZDIGI SOCKS5 tunnel
        run: |
          curl --fail --socks5 127.0.0.1:1080 https://api.ipify.org
          curl --fail --socks5 127.0.0.1:1080 https://rewards.bing.com -I

      - name: Install dependencies
        working-directory: bot
        run: |
          npm ci
          npx patchright install chromium
          npm run build

      - name: Run bot
        working-directory: bot
        id: run_bot
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npm start 2>&1 | tee ../bot-run.log

      - name: Send Telegram summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_STATUS: ${{ steps.run_bot.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY="$(grep -E 'RUN-END|RECOVERY_ACCOUNT_RESULT|ACCOUNT-ERROR|pointsGained|Completed all accounts' bot-run.log | tail -80 || true)"

          if [ -z "$SUMMARY" ]; then
            SUMMARY="$(tail -80 bot-run.log || true)"
          fi

          TEXT="Microsoft Rewards run: ${BOT_STATUS}
          Repo: ${{ github.repository }}
          Run: ${RUN_URL}

          ${SUMMARY}"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

      - name: Fail workflow if bot failed
        if: steps.run_bot.outcome == 'failure'
        run: exit 1
