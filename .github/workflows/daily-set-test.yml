name: Selected activity verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/daily-set-test.yml']
permissions:
  contents: read
concurrency:
  group: rewards-accounts-1-6
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Select current Vietnam date
        id: date
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'date='+new Date(Date.now()+7*3600000).toISOString().slice(0,10)+'\n')"
  verify:
    name: Verification
    needs: plan
    uses: ./.github/workflows/rewards-account.yml
    with:
      account: 1
      run_mode: test
      run_date: ${{ needs.plan.outputs.date }}
      debug_daily_set: true
    secrets: inherit
